<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScamShield AI • Admin Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="login-wrap"><div class="login-card"><div class="brand">🛡️ SCAMSHIELD <span>AI</span></div><p class="eyebrow">ADMIN PORTAL</p><h1>Secure Dashboard Login</h1><p class="muted">Access scan history and validate user feedback.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><div class="password-wrap"><input id="adminPassword" name="password" type="password" autocomplete="current-password" required><button type="button" class="show-password" onclick="togglePassword()" aria-label="Show password" title="Show password"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div><button type="submit">Sign in to Admin Dashboard</button></form><script>function togglePassword(){const p=document.getElementById('adminPassword');const b=document.querySelector('.show-password');const show=p.type==='password';p.type=show?'text':'password';b.classList.toggle('active', show);b.setAttribute('aria-label',show?'Hide password':'Show password');b.setAttribute('title',show?'Hide password':'Show password');}</script><a class="back" href="/">← Back to ScamShield</a></div></div></body></html>
